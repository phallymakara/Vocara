[project]
name = "vocara-worker"
version = "0.1.0"
description = "Vocara - GPU Inference Worker for VoxCPM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "soundfile>=0.12.1",
    "pydantic>=2.9.0",
    "redis>=5.1.0",
    "structlog>=24.4.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
