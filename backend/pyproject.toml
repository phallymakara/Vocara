[project]
name = "vocara"
version = "0.1.0"
description = "Vocara - Developer-Facing Voice API Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vocara Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "redis>=5.1.0",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "orjson>=3.10.7",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "mcp>=1.0.0",
    "edge-tts>=7.0.0",
]

[project.scripts]
vocara = "vocara.main:run"
vocara-worker = "vocara.worker.main:run"
vocara-mcp = "vocara.mcp.cli:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocara"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
