services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: vocara-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vocara_user
      POSTGRES_PASSWORD: vocara_password
      POSTGRES_DB: vocara_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - vocara_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocara_user -d vocara_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: vocara-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vocara_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  vocara_postgres_data:
    name: vocara_postgres_data
  vocara_redis_data:
    name: vocara_redis_data
