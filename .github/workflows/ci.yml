name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend CI: Linting, Database Migrations & Pytest Suite
  # ============================================================================
  backend:
    name: Backend (Python 3.13, Postgres, Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vocara_user
          POSTGRES_PASSWORD: vocara_password
          POSTGRES_DB: vocara_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Run Ruff Linter
        run: uv run ruff check src/ tests/

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://vocara_user:vocara_password@localhost:5432/vocara_db
        run: uv run alembic upgrade head

      - name: Run Pytest Suite with Coverage
        env:
          DATABASE_URL: postgresql+asyncpg://vocara_user:vocara_password@localhost:5432/vocara_db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
          DEBUG: "true"
          STORAGE_BACKEND: local
          LOCAL_STORAGE_DIR: ./storage_test
        run: uv run pytest --cov=src/vocara --cov-report=term-missing tests/

  # ============================================================================
  # 2. Frontend CI: TypeScript Strict Type Check & Vite Production Build
  # ============================================================================
  frontend:
    name: Frontend (Node 20, TypeScript, Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript & Vite Production Build
        run: npm run build

  # ============================================================================
  # 3. Docker Validation: Compose Configuration & Multi-Stage Builds
  # ============================================================================
  docker-validate:
    name: Docker Compose & Image Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Production Docker Compose Config
        run: docker compose -f docker-compose.prod.yml config --quiet
